  for(const bm of G.beams){
    const L=2000, x1=bm.x-Math.cos(bm.a)*L,y1=bm.y-Math.sin(bm.a)*L,x2=bm.x+Math.cos(bm.a)*L,y2=bm.y+Math.sin(bm.a)*L;
    if(bm.warn>0){ ctx.strokeStyle='rgba(214,255,138,.45)'; ctx.lineWidth=1.5; ctx.setLineDash([8,8]); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.setLineDash([]); }
    else { ctx.strokeStyle='rgba(214,255,138,.35)'; ctx.lineWidth=18; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.strokeStyle='#f4ffe0'; ctx.lineWidth=5; ctx.stroke(); }
  }
  for(const q of G.queue){ if(q.t>.9) continue; const a=.4+.4*Math.sin(t*20); ctx.strokeStyle=FAC[G.fac].color; ctx.globalAlpha=a; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(q.x,q.y,14+q.t*20,0,TAU); ctx.stroke(); ctx.globalAlpha=1; }
  for(const p of G.pickups){
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.t*3);
    if(p.type==='scrap'){ ctx.fillStyle='#ffc857'; const s=3+Math.min(3,p.val*.6); ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s,0); ctx.lineTo(0,s); ctx.lineTo(-s,0); ctx.fill(); }
    else { const c={heal:'#7ee081',over:'#ff8a5b',shield:'#5ce1e6'}[p.type]; ctx.strokeStyle=c; ctx.lineWidth=2.5; ctx.strokeRect(-7,-7,14,14); ctx.fillStyle=c;
      if(p.type==='heal'){ ctx.fillRect(-1.5,-5,3,10); ctx.fillRect(-5,-1.5,10,3); } else { ctx.beginPath(); ctx.arc(0,0,3.5,0,TAU); ctx.fill(); } }
    ctx.restore();
  }
  for(const e of G.enemies) drawEnemy(e,t);
  for(const a of G.allies) drawAlly(a,t);
  for(const p of G.pods){ ctx.fillStyle='#5ce1e6'; ctx.beginPath(); ctx.arc(p.x,p.y,5,0,TAU); ctx.fill(); part(p.x,p.y,rand(-20,20),rand(-20,20),.2,'#5ce1e6',2); }
  for(const b of G.pb){
    ctx.fillStyle=b.c;
    if(b.kind==='rail'){ const a=Math.atan2(b.vy,b.vx); ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(a); ctx.fillRect(-26,-1.5,30,3); ctx.restore(); }
    else if(b.kind==='missile'){ const a=Math.atan2(b.vy,b.vx); ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(a); ctx.fillRect(-6,-2.5,12,5); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill(); }
  }
  for(const z of G.zaps){ ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(z.x1,z.y1); ctx.lineTo(z.x2,z.y2); ctx.stroke(); }
  if(P.land!=null&&mode==='play'){ const pts=previewPath(); ctx.fillStyle='#5ce1e6'; pts.forEach((q,i)=>{ if(i%2) return; ctx.globalAlpha=(1-i/pts.length)*.8; ctx.beginPath(); ctx.arc(q[0],q[1],2,0,TAU); ctx.fill(); }); ctx.globalAlpha=1;
    if(P.charging){ ctx.strokeStyle='#ffc857'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(P.x,P.y,18,-Math.PI/2,-Math.PI/2+TAU*P.charge); ctx.stroke(); } }
  if(mode!=='dying'&&run.hull>0){
    const blink=P.inv>0&&Math.floor(t*16)%2===0;
    if(P.phaseT>0){ ctx.globalAlpha=.35; drawShip(P.x-P.vx*.03,P.y-P.vy*.03,P.face); drawShip(P.x-P.vx*.06,P.y-P.vy*.06,P.face); ctx.globalAlpha=1; }
    drawShip(P.x,P.y,P.face,1,blink);
    ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(P.x,P.y,2.6,0,TAU); ctx.fill();
    if(P.shield){ ctx.strokeStyle='rgba(92,225,230,.8)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(P.x,P.y,20+Math.sin(t*6),0,TAU); ctx.stroke(); }
    if(M('anchor')){ ctx.strokeStyle='rgba(182,144,255,.2)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(P.x,P.y,130,0,TAU); ctx.stroke(); }
    if(P.over>0){ ctx.strokeStyle='rgba(255,138,91,.6)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(P.x,P.y,25,t*4,t*4+TAU*(P.over/8)); ctx.stroke(); }
    const ns=st.sats;
    for(let i=0;i<ns;i++){ const sa=P.satA+i*TAU/ns; const sx=P.x+Math.cos(sa)*36, sy=P.y+Math.sin(sa)*36;
      ctx.save(); ctx.translate(sx,sy); ctx.rotate(sa); ctx.fillStyle='#9ff3f5'; ctx.fillRect(-4,-4,8,8); ctx.fillStyle='rgba(159,243,245,.45)'; ctx.fillRect(-10,-1.5,20,3); ctx.restore(); }
  }
  for(const b of G.eb){ ctx.fillStyle=b.c; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill(); ctx.fillStyle='#fff4f6'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r*.45,0,TAU); ctx.fill(); }
  for(let i=G.parts.length-1;i>=0;i--){ const p=G.parts[i]; p.life-=1/60; if(p.life<=0){G.parts.splice(i,1);continue;} p.x+=p.vx/60; p.y+=p.vy/60; p.vx*=.96; p.vy*=.96; ctx.globalAlpha=p.life/p.max; ctx.fillStyle=p.c; ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s); }
  ctx.globalAlpha=1;
  for(let i=rings.length-1;i>=0;i--){ const r=rings[i]; r.t+=1/60; if(r.t>.4){rings.splice(i,1);continue;} ctx.strokeStyle=r.c; ctx.globalAlpha=1-r.t/.4; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(r.x,r.y,r.r*(.4+r.t*1.5),0,TAU); ctx.stroke(); }
  ctx.globalAlpha=1;
  ctx.restore();
  drawHUD();
}
function previewPath(){
  const spd=380+P.charge*540; let x=P.x,y=P.y,vx=Math.cos(P.ang)*spd,vy=Math.sin(P.ang)*spd,ign=.3; const pts=[],dt=1/30;
  for(let i=0;i<44;i++){
    const g=gravity(x,y); vx+=g[0]*dt; vy+=g[1]*dt; const dr=Math.exp(-.25*dt); vx*=dr; vy*=dr; x+=vx*dt; y+=vy*dt; ign-=dt;
    if(x<SR){x=SR;vx=Math.abs(vx)*.92;} if(x>W-SR){x=W-SR;vx=-Math.abs(vx)*.92;} if(y<SR){y=SR;vy=Math.abs(vy)*.92;} if(y>H-SR){y=H-SR;vy=-Math.abs(vy)*.92;}
    pts.push([x,y]);
    if(G.planets.some((p,j)=>(j!==P.land||ign<=0)&&d2(x,y,p.x,p.y)<(p.r+12)**2)) break;
  }
  return pts;
}
function hex(x,y,r,fill,stroke){ ctx.beginPath(); for(let i=0;i<6;i++){ const a=i*TAU/6+Math.PI/6; ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);} ctx.closePath(); if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();} }
function drawHUD(){
  ctx.save(); ctx.textBaseline='middle';
  for(let i=0;i<run.maxHull;i++) hex(30+i*22,28,8,i<run.hull?'#ff4f79':null,'#ff4f79');
  let sx=30+run.maxHull*22+8;
  if(st.shieldCd){ ctx.strokeStyle='#5ce1e6'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(sx,28,8,0,TAU); ctx.stroke();
    if(P.shield){ ctx.fillStyle='#5ce1e6'; ctx.beginPath(); ctx.arc(sx,28,5,0,TAU); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(sx,28); ctx.arc(sx,28,5,-Math.PI/2,-Math.PI/2+TAU*P.shieldT/st.shieldCd); ctx.fillStyle='rgba(92,225,230,.5)'; ctx.fill(); } sx+=24; }
  if(M('phase')){ const cd=[0,3,2.4,1.8][M('phase')], f=P.dashCd>0?1-P.dashCd/cd:1; ctx.strokeStyle='#9ff3f5'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(sx,28,7,-Math.PI/2,-Math.PI/2+TAU*f); ctx.stroke(); }
  ctx.fillStyle='rgba(46,52,112,.9)'; ctx.fillRect(22,46,160,6); ctx.fillStyle=P.fuel<20?'#ff8a5b':'#5ce1e6'; ctx.fillRect(22,46,160*P.fuel/st.fuel,6);
  ctx.font=`500 12px ${FONT}`; ctx.fillStyle='#9aa0c8'; ctx.textAlign='left'; ctx.fillText('Fuel',188,49);
  ctx.fillStyle='#ffc857'; ctx.beginPath(); ctx.moveTo(30,64); ctx.lineTo(36,70); ctx.lineTo(30,76); ctx.lineTo(24,70); ctx.fill();
  ctx.font=`700 16px ${FONT}`; ctx.fillText(Math.floor(run.scrap)+' scrap',44,71);
  if(G.allies.length||run.squad.length){ ctx.font=`500 12px ${FONT}`; ctx.fillStyle='#9aa0c8';
    const up=G.allies.filter(a=>!a.down).length; ctx.fillText(`Squad ${up}/${G.allies.length}`+(M('tactics')?`, ${run.tactic} (Q)`:''),24,94); }
  ctx.textAlign='right'; ctx.fillStyle=FAC[G.fac].color; ctx.font=`700 16px ${FONT}`; ctx.fillText(FAC[G.fac].name,W-24,26);
  ctx.fillStyle='#9aa0c8'; ctx.font=`500 13px ${FONT}`; ctx.fillText(NODE_T[G.kind].name+(G.clear?'':`, wave ${Math.max(1,G.wave)} of ${G.waves.length}`),W-24,46);
  ctx.fillText(run.weapons.map(w=>`${WEAP[w.t].name} ${w.lvl}`).join('   '),W-24,66);
  if(G.boss){ const b=G.boss, bw=460; ctx.fillStyle='rgba(46,52,112,.9)'; ctx.fillRect(W/2-bw/2,22,bw,8); ctx.fillStyle=FAC[G.fac].color; ctx.fillRect(W/2-bw/2,22,bw*Math.max(0,b.hp/b.maxHp),8);
    ctx.textAlign='center'; ctx.fillStyle=FAC[G.fac].color; ctx.font=`700 13px ${FONT}`; ctx.fillText(FAC[G.fac].boss,W/2,42); }
  if(G.banner&&G.banner.t>0){ const b=G.banner; b.t-=1/60; const a=Math.min(1,b.t*2,(b.max-b.t)*4);
    ctx.globalAlpha=a; ctx.textAlign='center'; ctx.font=`800 30px ${FONT}`; ctx.fillStyle='#f3e9d2'; ctx.fillText(b.text,W/2,G.boss?84:70); ctx.globalAlpha=1; }
  ctx.textAlign='center'; ctx.font=`500 13px ${FONT}`; ctx.fillStyle='rgba(154,160,200,.9)';
  const hint=P.land!=null?'Hold Space to charge a launch      A and D to walk      B to build':'W A S D to steer'+(M('phase')?'      Shift to dash':'')+'      Land on any planet to refuel and build';
  ctx.fillText(hint,W/2,H-20);
  ctx.restore();
}

function drawMap(t){
  drawBG(t,t*.5);
  const Mp=run.map, N=Mp.nodes;
  // faction territory wedges
  for(const f of FKEYS){ const F=FAC[f]; ctx.fillStyle=F.color; ctx.globalAlpha=run.flags[f]?.03:.07; ctx.beginPath(); ctx.moveTo(MC.x,MC.y);
    for(let a=F.ang-Math.PI/4;a<=F.ang+Math.PI/4+.001;a+=.05) ctx.lineTo(MC.x+Math.cos(a)*MC.rx*5.6,MC.y+Math.sin(a)*MC.ry*5.6); ctx.closePath(); ctx.fill(); }
  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(46,52,112,.5)'; ctx.lineWidth=1;
  for(let k=1;k<=5;k++){ ctx.beginPath(); ctx.ellipse(MC.x,MC.y,MC.rx*k,MC.ry*k,0,0,TAU); ctx.stroke(); }
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  ctx.fillStyle='#f3e9d2'; ctx.font=`800 34px ${FONT}`; ctx.fillText('Star chart',36,56);
  ctx.fillStyle='#9aa0c8'; ctx.font=`500 14px ${FONT}`;
  ctx.fillText(run.won?`${run.fk} flagships destroyed. The run is already a win.`:`Flagships destroyed: ${run.fk} of 2 needed to win`,38,80);
  // faction labels by flagship
  ctx.textAlign='center';
  for(const f of FKEYS){ const fn=N.find(n=>n.type==='flagship'&&n.fac===f); const lx=clamp(fn.x,120,W-120), ly=f==='choir'?fn.y-34:f==='tide'?fn.y+44:fn.y-40;
    ctx.fillStyle=FAC[f].color; ctx.font=`700 14px ${FONT}`; ctx.fillText(FAC[f].name+(run.flags[f]?' (defeated)':''),lx,ly); }
  // legend
  const leg=['combat','elite','outpost','recruit','anomaly','flagship']; ctx.font=`500 12.5px ${FONT}`; ctx.textAlign='left';
  leg.forEach((k,i)=>{ const x=W-178,y=34+i*20; nodeMarker(x,y,6,k,t,false); ctx.fillStyle='#c9cdea'; ctx.fillText(NODE_T[k].name,x+16,y+4); });
  // edges
  const hist=run.history, A=Mp.adj;
  const traveled=new Set(); for(let i=1;i<hist.length;i++){ const a=hist[i-1],b=hist[i]; traveled.add(a<b?a+'-'+b:b+'-'+a); }
  for(const [i,j] of Mp.edges){ const n=N[i],m=N[j], tr=traveled.has(i+'-'+j);
    ctx.strokeStyle=tr?'rgba(92,225,230,.85)':'rgba(120,128,200,.25)'; ctx.lineWidth=tr?3:1.3; ctx.beginPath(); ctx.moveTo(n.x,n.y); ctx.lineTo(m.x,m.y); ctx.stroke(); }
  if(run.route.length){ ctx.strokeStyle='#ffc857'; ctx.lineWidth=3; ctx.setLineDash([10,8]); ctx.lineDashOffset=-t*30; ctx.beginPath(); ctx.moveTo(N[run.pos].x,N[run.pos].y); run.route.forEach(id=>ctx.lineTo(N[id].x,N[id].y)); ctx.stroke(); ctx.setLineDash([]); }
  const lastId=run.route.length?run.route[run.route.length-1]:run.pos, reach=A[lastId];
  const hover=mode==='map'?nodeAt(mouse.x,mouse.y):null;
  for(const n of N){
    const r=n.type==='flagship'?20:n.type==='hub'?16:12;
    const dead=n.type==='flagship'&&run.flags[n.fac];
    if(reach.includes(n.id)&&!dead){ ctx.strokeStyle=`rgba(255,200,87,${.35+.4*Math.sin(t*4)})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(n.x,n.y,r+9,0,TAU); ctx.stroke(); }
    ctx.globalAlpha=(n.visited&&n.id!==run.pos&&n.type!=='hub')?.4:1;
    drawPlanet(n.x,n.y,r*.72,n.look,t*.3);
    nodeMarker(n.x,n.y,r,n.type,t,n===hover,n.fac);
    if(dead){ ctx.strokeStyle='#ff4f79'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(n.x-12,n.y-12); ctx.lineTo(n.x+12,n.y+12); ctx.moveTo(n.x+12,n.y-12); ctx.lineTo(n.x-12,n.y+12); ctx.stroke(); }
    ctx.globalAlpha=1;
    const ri2=run.route.indexOf(n.id);
    if(ri2>=0){ ctx.fillStyle='#ffc857'; ctx.beginPath(); ctx.arc(n.x+r+2,n.y-r-2,9,0,TAU); ctx.fill(); ctx.fillStyle='#0a0e24'; ctx.font=`800 11px ${FONT}`; ctx.textAlign='center'; ctx.fillText(ri2+1,n.x+r+2,n.y-r+2); ctx.textAlign='left'; }
  }
  const cur=N[run.pos], oa=t*1.6; drawShip(cur.x+Math.cos(oa)*26,cur.y+Math.sin(oa)*26,oa+Math.PI/2,.75);
  if(hover){
    const T=NODE_T[hover.type], F=hover.fac?FAC[hover.fac]:null; const bw=300;
    let title=hover.type==='flagship'?F.boss:T.name; if(hover.id===run.pos) title+=' (you are here)';
    let desc=hover.visited&&hover.type!=='hub'?'Already visited. You can pass through freely.':T.desc;
    if(F&&!hover.visited) desc+=' '+F.threat;
    ctx.font=`400 12.5px ${FONT}`; const lines=wrapLines(desc,bw-24); const bh=58+lines.length*16;
    let x=hover.x+28,y=hover.y-30; if(x+bw>W-10) x=hover.x-28-bw; y=clamp(y,10,H-bh-80);
    ctx.fillStyle='rgba(20,24,56,.97)'; ctx.strokeStyle=F?F.color:T.color; ctx.lineWidth=1.5; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,bw,bh,8); else ctx.rect(x,y,bw,bh); ctx.fill(); ctx.stroke();
    ctx.textAlign='left'; ctx.fillStyle='#f3e9d2'; ctx.font=`700 15px ${FONT}`; ctx.fillText(title,x+12,y+22);
    if(F){ ctx.fillStyle=F.color; ctx.font=`600 12px ${FONT}`; ctx.fillText(`${F.name} territory`,x+12,y+40); }
    ctx.fillStyle='#c9cdea'; ctx.font=`400 12.5px ${FONT}`; lines.forEach((l,i)=>ctx.fillText(l,x+12,y+(F?58:42)+i*16));
    cv.style.cursor=(reach.includes(hover.id)||run.route.includes(hover.id)||A[run.pos].includes(hover.id))?'pointer':'default';
  } else cv.style.cursor='default';
}
function nodeMarker(x,y,r,type,t,hot,fac){
  const col=type==='flagship'&&fac?FAC[fac].color:NODE_T[type].color;
  ctx.strokeStyle=col; ctx.lineWidth=hot?3.5:2.3;
  if(type==='elite'){ ctx.beginPath(); for(let i=0;i<14;i++){ const a=i*TAU/14, rr=i%2?r:r+4; ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);} ctx.closePath(); ctx.stroke(); }
  else if(type==='outpost'){ ctx.strokeRect(x-r,y-r,r*2,r*2); }
  else if(type==='recruit'){ ctx.beginPath(); ctx.moveTo(x,y-r-2); ctx.lineTo(x+r+2,y); ctx.lineTo(x,y+r+2); ctx.lineTo(x-r-2,y); ctx.closePath(); ctx.stroke(); }
  else if(type==='anomaly'){ ctx.setLineDash([4,4]); ctx.beginPath(); ctx.arc(x,y,r,t,t+TAU); ctx.stroke(); ctx.setLineDash([]); }
  else if(type==='flagship'){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(x,y,r+6,0,TAU); ctx.stroke(); }
  else if(type==='hub'){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke(); for(let i=0;i<4;i++){ const a=i*Math.PI/2; ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*(r+3),y+Math.sin(a)*(r+3)); ctx.lineTo(x+Math.cos(a)*(r+9),y+Math.sin(a)*(r+9)); ctx.stroke(); } }
  else { ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke(); }
}
function wrapLines(text,maxW){ const words=text.split(' '), out=[]; let line=''; for(const w of words){ const tst=line?line+' '+w:w; if(ctx.measureText(tst).width>maxW&&line){ out.push(line); line=w; } else line=tst; } out.push(line); return out; }

const titleSys={planets:[{r:70,look:{h:195,ring:true,band:true},d:0,s:0},{r:26,look:{h:25,ring:false,band:true},d:230,s:.35},{r:18,look:{h:300,ring:false,band:false},d:340,s:-.22},{r:34,look:{h:140,ring:false,band:true},d:460,s:.14}]};
function drawTitle(t){
  drawBG(t,t*.3);
  const cx=W*.7,cy=H*.52;
  ctx.strokeStyle='rgba(120,128,200,.18)'; ctx.lineWidth=1;
  titleSys.planets.forEach(p=>{ if(p.d){ ctx.beginPath(); ctx.ellipse(cx,cy,p.d,p.d*.42,0,0,TAU); ctx.stroke(); } });
  const pos=titleSys.planets.map(p=>{ const a=t*p.s+p.d; return [cx+Math.cos(a)*p.d,cy+Math.sin(a)*p.d*.42]; });
  const order=titleSys.planets.map((p,i)=>i).sort((a,b)=>pos[a][1]-pos[b][1]);
  order.forEach(i=>{ const p=titleSys.planets[i]; drawPlanet(pos[i][0],pos[i][1],p.r,p.look,t*.4); });
  const cyc=(t*.45)%2, from=cyc<1?1:3, to=cyc<1?3:1, k=cyc%1, e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  const A=pos[from],B=pos[to],mx=(A[0]+B[0])/2,my=Math.min(A[1],B[1])-150;
  const x=(1-e)*(1-e)*A[0]+2*(1-e)*e*mx+e*e*B[0], y=(1-e)*(1-e)*A[1]+2*(1-e)*e*my+e*e*B[1];
  const dx=2*(1-e)*(mx-A[0])+2*e*(B[0]-mx), dy=2*(1-e)*(my-A[1])+2*e*(B[1]-my);
  drawShip(x,y,Math.atan2(dy,dx),1.1);
  FKEYS.forEach((f,i)=>{ const a=t*.9+i*TAU/4; ctx.fillStyle=FAC[f].bullet; ctx.beginPath(); ctx.arc(cx+Math.cos(a)*110,cy+Math.sin(a)*46-4,5,0,TAU); ctx.fill(); });
}

// ================= loop =================
let last=performance.now(), clock=0;
function frame(now){
  const dt=Math.min(.033,(now-last)/1000); last=now; clock+=dt;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  if((mode==='play'||mode==='dying')&&G) update(dt);
  if(bg==='title') drawTitle(clock);
  else if(bg==='map'&&run) drawMap(clock);
  else if(bg==='stage'&&G&&run) drawStage();
  requestAnimationFrame(frame);
}
toTitle();
requestAnimationFrame(frame);
})();
